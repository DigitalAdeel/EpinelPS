name: Sync, Build, and Release

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Job 1: Build directly from Upstream Repository's Latest Commit
  build-upstream:
    name: Build Upstream Latest Commit
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.upstream_info.outputs.sha_short }}
      upstream_sha_full: ${{ steps.upstream_info.outputs.sha_full }}
      upstream_repo: ${{ steps.upstream_info.outputs.repo }}

    steps:
      - name: Resolve Upstream Repository and Latest SHA
        id: upstream_info
        run: |
          # Dynamically fetch parent repo name via API to avoid linter warnings
          UPSTREAM_REPO=$(gh api "repos/${{ github.repository }}" --jq '.parent.full_name // "${{ github.repository }}"')

          # Get latest commit SHA directly from the upstream main branch
          FULL_SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/main" --jq '.sha')
          SHORT_SHA=$(echo "${FULL_SHA}" | cut -c1-7)

          echo "repo=${UPSTREAM_REPO}" >> $GITHUB_OUTPUT
          echo "sha_full=${FULL_SHA}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHORT_SHA}" >> $GITHUB_OUTPUT

          echo "Targeting Upstream Repo: ${UPSTREAM_REPO}"
          echo "Targeting Upstream Commit SHA: ${SHORT_SHA}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Upstream Code at Target SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.upstream_info.outputs.repo }}
          ref: ${{ steps.upstream_info.outputs.sha_full }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Windows Executable
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -o ./build-output/win-x64

      - name: Build Linux Executable
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained true -o ./build-output/linux-x64

      - name: Package Binaries into Zips
        run: |
          mkdir -p packaged-artifacts
          cd build-output/win-x64 && zip -r "../../packaged-artifacts/EpinelPS_ServerSelector_WINX64.zip" . && cd ../..
          cd build-output/linux-x64 && zip -r "../../packaged-artifacts/EpinelPS_LINUX64.zip" . && cd ../..

      - name: Upload Packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-release-assets
          path: packaged-artifacts/*
          retention-days: 1

  # Job 2: Check for existing release and publish on Fork using Upstream Tag
  package-and-release:
    name: Create GitHub Release
    needs: build-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check Existing Release on Fork
        id: check_release
        run: |
          TARGET_SHA="${{ needs.build-upstream.outputs.upstream_sha }}"
          if gh release view "${TARGET_SHA}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release for upstream commit ${TARGET_SHA} already exists. Skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "No existing release found for upstream commit ${TARGET_SHA}. Proceeding."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Build Artifacts
        if: ${{ steps.check_release.outputs.exists == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: compiled-release-assets
          path: release-files

      - name: Create GitHub Release on Fork
        if: ${{ steps.check_release.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-upstream.outputs.upstream_sha }}
          name: Release ${{ needs.build-upstream.outputs.upstream_sha }}
          body: |
            Automated release compiled directly from upstream origin commit `${{ needs.build-upstream.outputs.upstream_sha }}`.
            
            Upstream Commit: https://github.com/${{ needs.build-upstream.outputs.upstream_repo }}/commit/${{ needs.build-upstream.outputs.upstream_sha_full }}
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
